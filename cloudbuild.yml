substitutions:
  _REGION: us-central1
  _SERVICE: repo-ai-backend
  _REPO: repo-ai-backend
  _DB_NAME: repoai
  _CLOUDSQL: softwarecontinuous6731503060:us-central1:repoai

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$SHORT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --region=$_REGION
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$SHORT_SHA
      - --platform=managed
      - --allow-unauthenticated
      - --add-cloudsql-instances=$_CLOUDSQL
      - --set-env-vars=APP_FRONTEND_URL=https://your-frontend-url
      - --set-env-vars=DB_URL=jdbc:mysql:///$$_DB_NAME?socketFactory=com.google.cloud.sql.mysql.SocketFactory&cloudSqlInstance=$$_CLOUDSQL&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - --set-env-vars=DB_USERNAME=appuser
      - --set-secrets=DB_PASSWORD=projects/$PROJECT_ID/secrets/DB_PASSWORD:latest
      - --set-secrets=GITHUB_CLIENT_ID=projects/$PROJECT_ID/secrets/GITHUB_CLIENT_ID:latest
      - --set-secrets=GITHUB_CLIENT_SECRET=projects/$PROJECT_ID/secrets/GITHUB_CLIENT_SECRET:latest

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$SHORT_SHA