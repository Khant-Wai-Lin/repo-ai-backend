substitutions:
  _REGION: us-central1
  _SERVICE: repo-ai-backend
  _REPO: repo-ai-backend
  _DB_NAME: repoai
  _CLOUDSQL: softwarecontinuous6731503060:us-central1:repoai

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # One-time per project, but safe to run idempotently: enable required APIs
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud --quiet services enable \
          run.googleapis.com \
          artifactregistry.googleapis.com \
          cloudbuild.googleapis.com \
          secretmanager.googleapis.com \
          sqladmin.googleapis.com

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$SHORT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud --quiet run deploy $_SERVICE \
          --region=$_REGION \
          --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$SHORT_SHA \
          --platform=managed \
          --allow-unauthenticated \
          --add-cloudsql-instances=$_CLOUDSQL \
          --set-env-vars=APP_FRONTEND_URL=https://your-frontend-url,DB_URL="jdbc:mysql:///$$_DB_NAME?socketFactory=com.google.cloud.sql.mysql.SocketFactory&cloudSqlInstance=$$_CLOUDSQL&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC",DB_USERNAME=repoai,DB_PASSWORD=Root123!,GITHUB_CLIENT_ID=Ov23liCT5p7llpIsuSF5,GITHUB_CLIENT_SECRET=2bd44ecd4c133e7d17cf371184f92e636a8afcad,PORT=8081,SERVER_PORT=8081
        echo "WARNING: Using plain env vars for sensitive values. Switch back to --set-secrets in production."

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$SHORT_SHA